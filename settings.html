<div class="p-6 h-full overflow-hidden">
    <div class="text-center mb-6">
        <h1 class="text-2xl font-bold text-gray-800 mb-2">Медико-педагого-психологические тесты</h1>
        <p class="text-lg text-gray-600">Яшара Ибадова</p>
        <p class="text-gray-500 mt-3">Для анализа тестов требуется заполнить поля</p>
    </div>

    <div class="max-w-2xl mx-auto space-y-5 overflow-y-auto" style="max-height: calc(90vh - 200px);">
        <!-- Пол -->
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Пол</label>
            <div class="flex space-x-4">
                <label class="flex items-center">
                    <input type="radio" name="gender" value="male" class="w-4 h-4 text-blue-600" 
                           ${App.state.userData.gender === 'male' ? 'checked' : ''}>
                    <span class="ml-2 text-gray-700">Мужской</span>
                </label>
                <label class="flex items-center">
                    <input type="radio" name="gender" value="female" class="w-4 h-4 text-blue-600"
                           ${App.state.userData.gender === 'female' ? 'checked' : ''}>
                    <span class="ml-2 text-gray-700">Женский</span>
                </label>
            </div>
        </div>

        <!-- Дата рождения -->
        <div>
            <label for="birthDate" class="block text-sm font-medium text-gray-700 mb-2">Дата рождения</label>
            <input type="date" id="birthDate" name="birthDate" 
                   value="${App.state.userData.birthDate || ''}"
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
        </div>

        <!-- Выбор теста -->
        <div class="bg-white rounded-xl shadow-md p-5">
            <h2 class="text-lg font-semibold text-gray-800 mb-3">Выбор теста</h2>
            <div class="grid grid-cols-2 gap-3 pt-1" id="image-selector"></div>
        </div>

        <!-- Кнопка Далее -->
        <button id="nextBtn" class="w-full btn-primary text-white py-2.5 px-4 rounded-lg font-semibold">
            Далее
        </button>
    </div>
</div>

<script src="js/settings.js"></script>
