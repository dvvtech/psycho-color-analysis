<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Медико-педагого-психологические тесты Яшара Ибадова</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');


        /* Убираем вертикальный скролл */
        html,
        body {
            overflow: hidden;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        .glass-effect {
            max-height: 95vh;
            overflow: hidden;
            margin: 1rem;
        }

        .page-container {
            height: 100%;
            overflow-y: auto;
            scrollbar-width: none;
            /* Для Firefox */
            -ms-overflow-style: none;
            /* Для IE и Edge */
        }

        .page-container::-webkit-scrollbar {
            display: none;
            /* Для Chrome, Safari и Opera */
        }

        /* Для страницы settings */
        #settings {
            max-height: 90vh;
            overflow-y: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        #settings::-webkit-scrollbar {
            display: none;
        }

        /* Для страницы coloring */
        #coloring {
            max-height: 90vh;
            overflow-y: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        #coloring::-webkit-scrollbar {
            display: none;
        }

        /* Корректировка отступов для контейнера с тестами */
        #image-selector {
            max-height: 300px;
            overflow-y: auto;
            padding-right: 4px;
        }

        /* Скрываем скролл для контейнера с тестами, но оставляем функциональность */
        #image-selector::-webkit-scrollbar {
            width: 4px;
        }

        #image-selector::-webkit-scrollbar-thumb {
            background-color: #cbd5e0;
            border-radius: 4px;
        }

        #image-selector::-webkit-scrollbar-track {
            background-color: #f1f5f9;
        }

        /* Для мобильных устройств */
        @media (max-width: 640px) {
            .glass-effect {
                margin: 0.5rem;
                max-height: 98vh;
            }

            #settings,
            #coloring {
                max-height: 95vh;
            }
        }

        /****************************************************/
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .glass-effect {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        #image-selector {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 1rem;
        }

        .image-item {
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
        }

        .image-item .image-preview {
            height: 200px;
            background-color: #f3f4f6;
        }

        .image-item.selected {
            border-color: #667eea;
            border-width: 2px;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.2);
        }

        .image-item.selected .image-preview {
            background-color: #f0f5ff;
        }

        /* Фиксированная высота для контейнера с canvas */
        .canvas-container {
            max-width: 785px;
            max-height: 800px;
            margin: 0 auto;
            overflow: hidden;
            border-radius: 0.5rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }

        /* Стили для canvas */
        #testCanvas {
            width: 100%;
            height: auto;
            display: block;
            max-height: 800px;
            object-fit: contain;
        }

        /* Адаптация для мобильных устройств */
        @media (max-height: 900px) {
            .canvas-container {
                max-height: 700px;
            }

            #testCanvas {
                max-height: 700px;
            }
        }

        @media (max-height: 800px) {
            .canvas-container {
                max-height: 600px;
            }

            #testCanvas {
                max-height: 600px;
            }
        }

        /* Стили для основного контента */
        .flex-1 {
            overflow-y: auto;
            max-height: calc(100vh - 80px);
            /* 80px - высота верхней панели */
        }

        .results-show .canvas-container {
            width: 50%;
            float: left;
        }

        .results-show .results-panel {
            width: 50%;
            float: right;
            display: block !important;
        }

        .color-btn.active {
            transform: scale(1.1);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .stat-bar {
            transition: width 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            transform: none;
            cursor: not-allowed;
        }

        .fade-enter {
            opacity: 0;
            transform: translateY(20px);
        }

        .fade-enter-active {
            opacity: 1;
            transform: translateY(0);
            transition: opacity 0.3s, transform 0.3s;
        }

        /* Стили для верхней панели инструментов */
        .bg-white.border-b {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .bg-white.border-b .flex {
            min-width: min-content;
        }

        /* Уменьшаем отступы между группами элементов */
        .space-x-2> :not([hidden])~ :not([hidden]) {
            margin-left: 0.5rem;
        }

        .space-x-1> :not([hidden])~ :not([hidden]) {
            margin-left: 0.25rem;
        }

        /* Фиксированная ширина для элементов, чтобы они не прыгали */
        #brushSize {
            width: 80px;
        }

        #zoomLevel {
            width: 48px;
            display: inline-block;
            text-align: center;
        }

        /* Адаптация для мобильных устройств */
        @media (max-width: 1200px) {
            .bg-white.border-b .flex {
                flex-wrap: wrap;
            }

            #colorPalette {
                max-width: 240px;
            }
        }

        /* Стили для палитры цветов */
        #colorPalette {
            max-width: 280px;
        }

        #colorPalette button {
            transition: all 0.2s ease;
        }

        #colorPalette button:hover {
            transform: scale(1.15);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
        }

        /* Для сетки 6 колонок */
        .grid-cols-6 {
            display: grid;
            grid-template-columns: repeat(6, minmax(0, 1fr));
            gap: 0.5rem;
        }


        /* Стили для поворота canvas */
        .rotate-90 {
            transform: rotate(90deg);
            transform-origin: center center;
        }

        .rotate-180 {
            transform: rotate(180deg);
            transform-origin: center center;
        }

        .rotate-270 {
            transform: rotate(270deg);
            transform-origin: center center;
        }

        /* Для правильного отображения при повороте */
        .canvas-container {
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #testCanvas {
            transition: transform 0.3s ease;
        }

        /* Стили для кнопки центрирования */
        #centerBtn {
            transition: all 0.2s ease;
        }

        #centerBtn:hover {
            background-color: #e5e5e5;
            transform: scale(1.05);
        }

        #centerBtn:active {
            transform: scale(0.95);
        }

        /* Анимация при нажатии */
        @keyframes centerPulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }

            100% {
                transform: scale(1);
            }
        }

        #centerBtn:active i {
            animation: centerPulse 0.3s ease;
        }

        /***************************/

        /* Уменьшаем отступы на мобильных устройствах */
        @media (max-width: 1024px) {
            .glass-effect {
                margin: 0.5rem;
            }

            #settings .max-w-2xl,
            #coloring .flex-1 {
                padding: 0.5rem;
            }
        }

        /* Для очень маленьких экранов */
        @media (max-width: 640px) {
            .glass-effect {
                margin: 0.25rem;
            }

            #settings .text-center h1 {
                font-size: 1.25rem;
            }

            #settings .text-center p {
                font-size: 0.875rem;
            }
        }

        /* Стили для индикатора загрузки */
        #loadingOverlay {
            transition: opacity 0.3s ease;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        #loadingOverlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Анимация спиннера */
        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .animate-spin {
            animation: spin 1s linear infinite;
        }

        /* Контейнер для canvas должен быть относительным для позиционирования overlay */
        .canvas-container {
            position: relative;
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4">
    <div class="max-w-7xl w-full glass-effect rounded-2xl shadow-2xl overflow-hidden">
        <!-- Контейнер для динамической загрузки страниц -->
        <div id="settings" class="page-container"></div>
        <div id="coloring" class="page-container hidden"></div>
    </div>

    <!-- Подключаем скрипты в правильном порядке -->
    <script src="js/app.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/coloring.js"></script>
</body>

</html>
