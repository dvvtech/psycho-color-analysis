<div class="h-full flex flex-col overflow-hidden">
    <!-- Индикатор загрузки -->
    <div id="loadingOverlay"
        class="hidden absolute inset-0 bg-white bg-opacity-80 z-50 flex items-center justify-center"
        style="backdrop-filter: blur(2px);">
        <div class="text-center">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-blue-500 border-t-transparent">
            </div>
            <p class="mt-4 text-gray-600 font-medium">Загрузка теста...</p>
            <p class="text-sm text-gray-400 mt-1">Пожалуйста, подождите</p>
        </div>
    </div>
    <!-- Модальное окно подтверждения очистки -->
    <div id="clearConfirmModal"
        class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center"
        style="backdrop-filter: blur(4px);">
        <div class="bg-white rounded-xl shadow-2xl max-w-md w-full mx-4 transform transition-all scale-100 opacity-100">
            <div class="p-6">
                <div class="flex items-center justify-center w-16 h-16 mx-auto bg-red-100 rounded-full mb-4">
                    <i class="fas fa-exclamation-triangle text-3xl text-red-500"></i>
                </div>

                <h3 class="text-xl font-bold text-gray-800 text-center mb-2">Очистить раскраску?</h3>

                <p class="text-gray-600 text-center mb-6">
                    Все изменения будут потеряны. Это действие нельзя отменить.
                </p>

                <div class="flex gap-3">
                    <button id="confirmClearBtn"
                        class="flex-1 px-4 py-2 bg-red-500 text-white rounded-lg font-semibold hover:bg-red-600 transition transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2">
                        <i class="fas fa-trash-alt mr-2"></i>Очистить
                    </button>
                    <button id="cancelClearBtn"
                        class="flex-1 px-4 py-2 bg-gray-200 text-gray-700 rounded-lg font-semibold hover:bg-gray-300 transition transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2">
                        Отмена
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Верхняя панель инструментов -->
    <div class="bg-white border-b border-gray-200 p-3 flex-shrink-0">
        <div class="flex flex-wrap items-center gap-2">
            <!-- Кнопка Главная -->
            <button id="homeBtn"
                class="px-3 py-1.5 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition whitespace-nowrap text-sm">
                <i class="fas fa-home mr-1"></i>Главная
            </button>

            <!-- Выбор цвета -->
            <div class="flex items-center space-x-1">
                <span class="text-xs text-gray-600 whitespace-nowrap">Цвет:</span>
                <div class="flex flex-wrap gap-1 max-w-[260px]" id="colorPalette"></div>
            </div>

            <!-- Размер кисти -->
            <div class="flex items-center space-x-1 whitespace-nowrap -ml-8">
                <span class="text-xs text-gray-600">Кисть:</span>
                <input type="range" id="brushSize" min="1" max="20" value="5" class="w-16 h-6">
                <span id="brushSizeValue" class="text-xs text-gray-600 w-7">5px</span>
            </div>

            <!-- Поворот -->
            <div class="flex items-center space-x-1">
                <button id="rotateLeft" class="p-1.5 bg-gray-100 rounded-lg hover:bg-gray-200 transition text-sm"
                    title="Повернуть влево">
                    <i class="fas fa-undo-alt"></i>
                    <span class="text-xs">-90°</span>
                </button>
                <button id="rotateRight" class="p-1.5 bg-gray-100 rounded-lg hover:bg-gray-200 transition text-sm"
                    title="Повернуть вправо">
                    <i class="fas fa-redo-alt"></i>
                    <span class="text-xs">+90°</span>
                </button>
            </div>

            <!-- Масштабирование -->
            <div class="flex items-center space-x-1">
                <button id="zoomOut" class="p-1.5 bg-gray-100 rounded-lg hover:bg-gray-200 transition text-sm"
                    title="Уменьшить">
                    <i class="fas fa-search-minus"></i>
                </button>
                <span id="zoomLevel" class="text-xs text-gray-600 w-10 text-center">100%</span>
                <button id="zoomIn" class="p-1.5 bg-gray-100 rounded-lg hover:bg-gray-200 transition text-sm"
                    title="Увеличить">
                    <i class="fas fa-search-plus"></i>
                </button>
            </div>

            <!-- Undo/Redo -->
            <div class="flex items-center space-x-1">
                <button id="undoBtn"
                    class="p-1.5 bg-gray-100 rounded-lg hover:bg-gray-200 transition opacity-50 cursor-not-allowed text-sm">
                    <i class="fas fa-undo"></i>
                </button>
                <button id="redoBtn"
                    class="p-1.5 bg-gray-100 rounded-lg hover:bg-gray-200 transition opacity-50 cursor-not-allowed text-sm">
                    <i class="fas fa-redo"></i>
                </button>
            </div>

            <!-- Кнопка Рука -->
            <div class="flex items-center space-x-1">
                <button id="handBtn" class="p-1.5 bg-gray-100 rounded-lg hover:bg-gray-200 transition text-sm"
                    title="Перемещение (рука)">
                    <i class="fas fa-hand-paper"></i>
                </button>
            </div>

            <!-- Кнопка Центрирования -->
            <div class="flex items-center space-x-1">
                <button id="centerBtn" class="p-1.5 bg-gray-100 rounded-lg hover:bg-gray-200 transition text-sm"
                    title="Центрировать изображение">
                    <i class="fas fa-arrows-alt"></i>
                </button>
            </div>

            <!-- Кнопки Рассчитать и Очистить -->
            <div class="flex items-center space-x-1 ml-auto">
                <button id="calculateBtn"
                    class="px-3 py-1.5 btn-primary text-white rounded-lg font-semibold whitespace-nowrap text-sm">
                    Рассчитать
                </button>
                <button id="clearBtn"
                    class="px-3 py-1.5 bg-gray-200 text-gray-700 rounded-lg font-semibold hover:bg-gray-300 transition whitespace-nowrap text-sm">
                    Очистить
                </button>
            </div>
        </div>
    </div>

    <!-- Основной контент с фиксированной высотой -->
    <div class="flex-1 p-4 overflow-hidden">
        <div class="relative h-full flex">
            <!-- Холст -->
            <div class="canvas-container flex-shrink-0">
                <canvas id="testCanvas" width="785" height="800"
                    class="border border-gray-200 rounded-lg shadow-lg w-full h-auto"></canvas>
            </div>

            <!-- Панель результатов (изначально скрыта) -->
            <div class="results-panel hidden ml-4 flex-1 overflow-y-auto">
                <div class="bg-white rounded-xl shadow-lg p-5">
                    <h3 class="text-lg font-semibold text-gray-800 mb-3">Результаты анализа</h3>
                    <div id="statsContainer" class="mb-4"></div>
                    
                    <div id="error"
                        class="hidden bg-red-50 border border-red-200 text-red-700 px-3 py-2 rounded-lg mb-3 text-sm">
                    </div>

                    <div id="results" class="hidden">
                        <div class="mb-3">
                            <h4 class="font-semibold text-gray-700 mb-1 text-sm">Основная характеристика:</h4>
                            <p id="mainCharacteristic" class="text-gray-600 bg-gray-50 p-2 rounded-lg text-sm"></p>
                        </div>

                        <div id="strengthsSection" class="mb-3 hidden">
                            <h4 class="font-semibold text-gray-700 mb-1 text-sm">Сильные стороны:</h4>
                            <ul id="strengthsList" class="list-disc list-inside text-gray-600 space-y-0.5 text-sm"></ul>
                        </div>

                        <div class="mb-3">
                            <h4 class="font-semibold text-gray-700 mb-1 text-sm">Рекомендации:</h4>
                            <ul id="recommendationsList"
                                class="list-disc list-inside text-gray-600 space-y-0.5 text-sm"></ul>
                        </div>

                        <!-- Кнопка отправки на почту -->
                        <div class="mt-6 pt-4 border-t border-gray-200">
                            <button id="sendEmailBtn"
                                class="w-full px-4 py-2 bg-green-500 text-white rounded-lg font-semibold hover:bg-green-600 transition flex items-center justify-center gap-2">
                                <i class="fas fa-envelope"></i>
                                Отправить результаты на почту
                            </button>

                            <!-- Форма ввода email (изначально скрыта) -->
                            <div id="emailForm" class="hidden mt-4 p-4 bg-gray-50 rounded-lg">
                                <label for="emailInput" class="block text-sm font-medium text-gray-700 mb-2">Введите
                                    email для отправки:</label>
                                <div class="flex gap-2">
                                    <input type="email" id="emailInput" placeholder="example@mail.com"
                                        class="flex-1 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 text-sm">
                                    <button id="confirmSendBtn"
                                        class="px-4 py-2 bg-green-500 text-white rounded-lg font-semibold hover:bg-green-600 transition text-sm whitespace-nowrap">
                                        Отправить
                                    </button>
                                </div>
                                <button id="cancelSendBtn" class="mt-2 text-xs text-gray-500 hover:text-gray-700">
                                    Отмена
                                </button>
                            </div>

                            <!-- Индикатор отправки (ВНЕ формы) -->
                            <div id="emailSending" class="hidden mt-4 text-center">
                                <i class="fas fa-spinner fa-spin text-green-500"></i>
                                <span class="text-sm text-gray-600 ml-2">Отправка...</span>
                            </div>

                            <!-- Сообщение об ошибке (ВНЕ формы) -->
                            <div id="emailError" class="hidden mt-2 text-xs text-red-500"></div>

                            <!-- Сообщение об успехе (ВНЕ формы) -->
                            <div id="emailSuccess" class="hidden mt-2 text-xs text-green-500"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="js/coloring.js"></script>
